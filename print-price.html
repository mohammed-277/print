<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الطباعة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#f1f4f6;--card:#fff;--ink:#13202b;--muted:#5c6a75;--line:#d3dce2;--c:#0891b2;--c-ink:#fff;--sel:#e0f4f9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151b;--card:#16212a;--ink:#e8eef2;--muted:#93a3ae;--line:#2a3943;--c:#22d3ee;--c-ink:#04222a;--sel:#0f3039;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d151b;--card:#16212a;--ink:#e8eef2;--muted:#93a3ae;--line:#2a3943;--c:#22d3ee;--c-ink:#04222a;--sel:#0f3039;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center}
.opts button small{display:block;color:var(--muted);font-size:12px}
.opts button[aria-pressed=true]{border-color:var(--c);background:var(--sel);font-weight:600}
.num{display:flex;align-items:center;gap:10px}
.num button{width:46px;height:46px;font:inherit;font-size:22px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.num input{flex:1;min-width:0;text-align:center;font:inherit;font-size:22px;font-weight:700;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=text]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.chk{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--c)}
.total{background:var(--c);color:var(--c-ink);border-radius:14px;padding:16px;margin:16px 0 10px;text-align:center}
.total .n{font-size:40px;font-weight:700;line-height:1.2}
.total .d{font-size:14px;opacity:.9}
.copy{width:100%;font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:13px;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.tg{display:block;text-align:center;margin-top:10px;padding:13px;border:2px solid var(--c);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
#msg{text-align:center;color:var(--muted);min-height:24px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>حاسبة الطباعة</h1>
<p class="sub">اكتب عدد الصفحات ويطلع لك السعر مباشرة.</p>

<div class="card"><h2>عدد الصفحات</h2>
<div class="num"><button id="pm" aria-label="أنقص">−</button><input id="pages" type="number" inputmode="numeric" min="0" value="10" aria-label="عدد الصفحات"><button id="pp" aria-label="زِد">+</button></div></div>

<div class="card"><h2>نوع الطباعة</h2>
<div class="opts" id="color">
<button data-v="bw" aria-pressed="true">أبيض وأسود<small id="p-bw"></small></button>
<button data-v="col" aria-pressed="false">ملوّن<small id="p-col"></small></button></div></div>

<div class="card"><h2>عدد النسخ</h2>
<div class="num"><button id="cm" aria-label="أنقص">−</button><input id="copies" type="number" inputmode="numeric" min="1" value="1" aria-label="عدد النسخ"><button id="cp" aria-label="زِد">+</button></div>
</div>

<div class="total"><div class="n" id="total">0</div><div class="d" id="detail"></div></div>
<a class="tg" href="tg://resolve?domain=m8hw8">افتح تلكرام (التطبيق): @m8hw8</a>
<a class="tg" href="https://t.me/m8hw8" target="_top">أو افتحه من المتصفح</a>
<p style="text-align:center;color:var(--muted)">أو ابحث في تلكرام عن: <b dir="ltr" style="color:var(--ink)">@m8hw8</b></p>
</main>
<script>
/* الأسعار: غيّرها من هنا فقط (بالدينار) */
var PRICE={bw:25,col:30,currency:"د.ع"};
var st={color:"bw"};
function $(i){return document.getElementById(i)}
function fmt(n){return n.toLocaleString("en-US")}
function val(id,min){var v=parseInt($(id).value,10);return isNaN(v)||v<min?min:v}
function calc(){
var pages=val("pages",0),copies=val("copies",1);
var per=PRICE[st.color];
var raw=pages*per*copies,total=raw>0?Math.max(250,Math.ceil((raw-125)/250)*250):0;
$("total").textContent=fmt(total)+" "+PRICE.currency;
$("detail").textContent=pages+" صفحة × "+fmt(per)+" × "+copies+" نسخة";
return {pages:pages,copies:copies,per:per,total:total}}
$("p-bw").textContent=PRICE.bw+" د.ع للصفحة";$("p-col").textContent=PRICE.col+" د.ع للصفحة";
function group(id,key){$(id).onclick=function(e){var b=e.target.closest("button");if(!b)return;st[key]=b.getAttribute("data-v");
Array.prototype.forEach.call($(id).children,function(x){x.setAttribute("aria-pressed",x===b)});calc()}}
group("color","color");
function step(id,d,min){$(id).value=Math.max(min,val(id,min)+d);calc()}
$("pm").onclick=function(){step("pages",-1,0)};$("pp").onclick=function(){step("pages",1,0)};
$("cm").onclick=function(){step("copies",-1,1)};$("cp").onclick=function(){step("copies",1,1)};
["pages","copies"].forEach(function(i){$(i).oninput=calc});
var _unused=function(){
var r=calc(),n="";
var t=(n?"الاسم: "+n+"\n":"")+"عدد الصفحات: "+r.pages+"\nالنسخ: "+r.copies+"\nالطباعة: "+(st.color==="bw"?"أبيض وأسود":"ملوّن")+"\nالسعر: "+fmt(r.total)+" "+PRICE.currency;
function ok(){$("msg").textContent="اننسخ الطلب. افتح تلكرام والصقه وأرسله."}
function bad(){$("msg").textContent="ما اننسخ. صوّر الشاشة وأرسلها."}
try{navigator.clipboard.writeText(t).then(ok,bad)}catch(e){bad()}}
calc();
</script>
</body>
</html>
